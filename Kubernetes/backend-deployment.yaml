apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: deepfakeshield
  labels:
    app: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: deepfakeshield-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: deepfakeshield-config
            - secretRef:
                name: deepfakeshield-secrets
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: model-cache
              mountPath: /home/app/.cache/huggingface
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: huggingface-cache
        - name: uploads
          emptyDir:
            sizeLimit: 1Gi
